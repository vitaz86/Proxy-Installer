# Optimized Dante SOCKS Configuration for High Performance
# Based on comprehensive optimization recommendations

# Logging (disabled for performance)
logoutput: /dev/null
errorlog: /dev/null

# Internal interface
internal: 0.0.0.0 port = 1080

# External interface (auto-detected)
external: eth0

# Users
user.privileged: root
user.notprivileged: nobody

# DNS (if using unbound)
# resolve { nameserver 127.0.0.1 }

# Rules
client pass { from: 0.0.0.0/0 to: 0.0.0.0/0 method: none }
client block { from: 0.0.0.0/0 to: 0.0.0.0/0 log: connect error }

pass { from: 0.0.0.0/0 to: 0.0.0.0/0 command: bind connect udpassociate log: error }

# Resource Limits
clientmaxidle: 3600
clientmaxlife: 86400
clientmaxbindport: 65535
buffersize: 65536

# Concurrency
maxthreads: 512