# Optimized Dante SOCKS Configuration for Low-Resource VPS
# Based on comprehensive optimization recommendations, adjusted for 1-2 cores, 1-2 GB RAM

# Logging (disabled for performance)
logoutput: /dev/null
errorlog: /dev/null

# Internal interface
internal: 0.0.0.0 port = 1080

# External interface (auto-detected)
external: eth0

# Users
user.privileged: root
user.notprivileged: nobody

# DNS (if using unbound)
# resolve { nameserver 127.0.0.1 }

# Rules
client pass { from: 0.0.0.0/0 to: 0.0.0.0/0 method: none }
client block { from: 0.0.0.0/0 to: 0.0.0.0/0 log: connect error }

pass { from: 0.0.0.0/0 to: 0.0.0.0/0 command: bind connect udpassociate log: error }

# Resource Limits (reduced for low resources)
clientmaxidle: 1800
clientmaxlife: 3600
clientmaxbindport: 32768
buffersize: 32768

# Concurrency (adjusted for 1-2 cores)
maxthreads: 64