# Optimized Squid Configuration for High Performance
# Based on comprehensive optimization recommendations

# Authentication (if needed)
# auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
# auth_param basic realm "Squid Proxy"
# acl authenticated proxy_auth REQUIRED

# Whitelist (if needed)
# acl whitelist src 192.168.1.0/24

# Access rules
http_access allow localhost
# http_access allow whitelist
# http_access allow authenticated
http_access deny all

# Port
http_port 3128

# Disable headers for privacy and performance
via off
forwarded_for off

# DNS (if using unbound)
# dns_nameservers 127.0.0.1

# Caching Optimizations
cache_mem 512 MB
maximum_object_size 10 MB
cache_dir ufs /var/spool/squid 10000 16 256
cache_replacement_policy heap LFUDA
store_avg_object_size 50 KB
read_ahead_gap 16 KB
refresh_pattern . 0 20% 4320

# Connection Handling
max_filedescriptors 16384
client_persistent_connections on
server_persistent_connections on
half_closed_clients off

# Memory Management
cache_swap_low 90
cache_swap_high 95
memory_pools on
memory_pools_limit 50 MB
request_header_max_size 64 KB

# Disk I/O Optimizations
unlinkd_program /usr/lib/squid/unlinkd

# Concurrency and Load Handling
workers 4
cpu_affinity_map process=0 cores=0-3
qos_flows local-hit=0.5
pipeline_prefetch 2

# Logging (optional, for performance disable or reduce)
# access_log /var/log/squid/access.log squid
# cache_log /var/log/squid/cache.log